plugins {
    id 'java'
    id 'application'
}

group = 'com.drivingsimulation'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.drivingsimulation.Application'
}

tasks.named('run') {
    standardInput = System.in
}

test {
    useJUnitPlatform()
}